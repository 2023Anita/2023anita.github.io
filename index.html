<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lixin Yin — Anesthesiologist & Medical AI Researcher</title>
<meta name="description" content="Lixin Yin is an anesthesiologist at Jiangyin People's Hospital and a medical AI researcher specializing in deep learning, bioinformatics, clinical decision support, and AI tools.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300..600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f0ede8;--color-divider:#dcd9d5;--color-border:rgba(40,37,29,0.12);
  --color-text:#28251d;--color-text-muted:#6b6a66;--color-text-faint:#b0afa9;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;--color-primary-highlight:#cedcd8;
  --color-accent:#964219;--glow-soft:rgba(1,105,111,0.13);--glow-strong:rgba(1,105,111,0.45);
  --font-display:'Instrument Serif',Georgia,'Noto Serif SC','Noto Serif JP',serif;
  --font-body:'DM Sans','Noto Sans SC','Noto Sans JP','Helvetica Neue',sans-serif;
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;--space-20:5rem;
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(40,37,29,0.07);--shadow-md:0 4px 12px rgba(40,37,29,0.09);
  --shadow-lg:0 12px 32px rgba(40,37,29,0.13);
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --content-narrow:640px;--content-default:960px;
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#252320;--color-divider:#262523;--color-border:rgba(205,204,202,0.1);
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#7dbac2;--color-primary-highlight:#313b3b;
  --color-accent:#bb653b;--glow-soft:rgba(79,152,163,0.16);--glow-strong:rgba(79,152,163,0.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.2);--shadow-md:0 4px 12px rgba(0,0,0,0.3);--shadow-lg:0 12px 32px rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth;scroll-padding-top:5rem}
body{min-height:100dvh;line-height:1.6;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);isolation:isolate;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
h1,h2,h3,h4{text-wrap:balance;line-height:1.15;font-family:var(--font-display)}
p,li{text-wrap:pretty;max-width:72ch}
a{color:var(--color-primary);text-decoration:none;transition:color var(--transition)}
a:hover{color:var(--color-primary-hover)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;transition:color var(--transition),background var(--transition),border-color var(--transition)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

.ambient-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.9}
body > :not(.ambient-canvas){position:relative;z-index:1}

nav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--color-bg) 92%,transparent);border-bottom:1px solid var(--color-divider);backdrop-filter:blur(12px)}
.nav-inner{max-width:var(--content-default);margin:0 auto;padding:var(--space-3) var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.nav-brand{font-family:var(--font-display);font-size:var(--text-lg);letter-spacing:-0.01em;color:var(--color-text);white-space:nowrap}
.nav-links{display:flex;gap:var(--space-5);list-style:none;align-items:center}
.nav-links a{font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;transition:color var(--transition)}
.nav-links a:hover{color:var(--color-primary)}
.nav-actions{display:flex;align-items:center;gap:var(--space-2)}
.lang-switcher{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-surface)}
.lang-btn{font-size:0.78rem;font-weight:600;line-height:1;padding:0.45rem 0.62rem;border-radius:var(--radius-full);color:var(--color-text-muted);white-space:nowrap}
.lang-btn:hover{color:var(--color-primary)}
.lang-btn[aria-pressed="true"]{background:var(--color-primary-highlight);color:var(--color-primary)}
.theme-toggle,.github-nav-link{display:flex;align-items:center;justify-content:center;padding:var(--space-2);border-radius:var(--radius-md);color:var(--color-text-muted)}
.theme-toggle:hover,.github-nav-link:hover{color:var(--color-text);background:var(--color-surface-offset)}
.github-nav-link:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}

.hero{position:relative;max-width:var(--content-default);margin:0 auto;padding:clamp(var(--space-16),8vw,var(--space-20)) var(--space-6) var(--space-12);overflow:hidden}
.hero::before{content:"";position:absolute;inset:var(--space-8) var(--space-6) var(--space-8);z-index:-1;border-radius:1.5rem;background:
  linear-gradient(90deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/42px 42px,
  linear-gradient(0deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/42px 42px;
  mask-image:linear-gradient(90deg,transparent,black 18%,black 82%,transparent);
  opacity:0.34;animation:grid-drift 18s linear infinite}
.hero::after{content:"";position:absolute;right:7%;top:22%;width:260px;height:260px;z-index:-1;border:1px solid var(--color-border);border-radius:50%;background:
  repeating-conic-gradient(from 0deg,var(--glow-soft) 0deg 8deg,transparent 8deg 20deg);
  mask-image:radial-gradient(circle,transparent 0 48%,black 49% 51%,transparent 52% 100%);
  opacity:0.45;animation:clinical-rotate 28s linear infinite}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-12);align-items:center}
.hero-name{font-size:var(--text-2xl);font-style:italic;color:var(--color-text);margin-bottom:var(--space-2)}
.hero-role{font-size:var(--text-lg);color:var(--color-primary);font-family:var(--font-body);font-weight:500;margin-bottom:var(--space-4)}
.hero-institution{font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6)}
.hero-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-6)}
.tag{font-size:var(--text-xs);padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-primary-highlight);color:var(--color-primary);font-weight:500}
.hero-bio{font-size:var(--text-base);color:var(--color-text-muted);line-height:1.7;max-width:60ch}
.hero-contact{margin-top:var(--space-6);display:flex;flex-wrap:wrap;gap:var(--space-3)}
.btn-primary{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-6);background:var(--color-primary);color:#fff;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;transition:background var(--transition)}
.btn-primary:hover{background:var(--color-primary-hover);color:#fff}
.btn-ghost{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;transition:all var(--transition)}
.btn-ghost:hover{border-color:var(--color-primary);color:var(--color-primary)}
.hero-avatar{position:relative;width:180px;height:180px;border-radius:var(--radius-lg);background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);overflow:hidden;flex-shrink:0}
.hero-avatar::after{content:"";position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--color-primary) 32%,transparent);border-radius:inherit;box-shadow:inset 0 0 28px rgba(1,105,111,0.14);pointer-events:none}

.section{border-top:1px solid var(--color-divider);padding:clamp(var(--space-12),6vw,var(--space-20)) var(--space-6)}
.section-inner{max-width:var(--content-default);margin:0 auto}
.section-header{margin-bottom:var(--space-10)}
.section-label{font-size:var(--text-xs);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-2)}
.section-title{font-size:var(--text-xl);color:var(--color-text)}

.medals-grid,.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-5)}
.medal-card,.project-card{position:relative;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-sm);transition:box-shadow var(--transition),transform var(--transition),border-color var(--transition);overflow:hidden}
.medal-card::after,.project-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 42%,var(--glow-soft) 50%,transparent 58% 100%);opacity:0;transform:translateX(-30%);transition:opacity var(--transition),transform 520ms cubic-bezier(0.16,1,0.3,1);pointer-events:none}
.medal-card:hover,.project-card:hover{border-color:color-mix(in srgb,var(--color-primary) 34%,var(--color-border));box-shadow:var(--shadow-md);transform:translateY(-2px)}
.medal-card:hover::after,.project-card:hover::after{opacity:1;transform:translateX(30%)}
.tilt-card{--tilt-x:0deg;--tilt-y:0deg;--tilt-lift:0px;transform:perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--tilt-lift));transform-style:preserve-3d;will-change:transform}
.tilt-card:hover{--tilt-lift:-3px}
.medal-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.medal-icon{width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.medal-silver{background:#e8e8e8;color:#6b6b6b}
.medal-bronze{background:#f5e6d3;color:#8b5e3c}
.medal-title,.project-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);line-height:1.3}
.medal-rank{font-size:var(--text-xs);color:var(--color-primary);font-weight:600;margin-bottom:var(--space-2)}
.medal-org,.medal-desc,.project-desc{font-size:var(--text-xs);color:var(--color-text-muted)}
.medal-org{margin-bottom:var(--space-2)}
.medal-desc,.project-desc{line-height:1.6}
.medal-date{font-size:var(--text-xs);color:var(--color-text-faint);margin-top:var(--space-3)}

.awards-list{display:flex;flex-direction:column;gap:var(--space-5)}
.award-item{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:start}
.award-badge,.project-stars{font-size:var(--text-xs);font-weight:600;padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-surface-offset);color:var(--color-accent);white-space:nowrap}
.award-badge{margin-top:3px}
.award-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);margin-bottom:var(--space-1)}
.award-project{font-size:var(--text-sm);color:var(--color-primary);font-style:italic;margin-bottom:var(--space-2)}
.award-meta{font-size:var(--text-xs);color:var(--color-text-muted)}

.project-card{display:flex;flex-direction:column;min-height:230px}
.project-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
.project-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin:var(--space-4) 0}
.project-tag{font-size:0.72rem;padding:0.15rem 0.5rem;border-radius:var(--radius-full);background:var(--color-primary-highlight);color:var(--color-primary);font-weight:600}
.project-link{display:inline-flex;align-items:center;gap:var(--space-2);margin-top:auto;font-size:var(--text-xs);font-weight:600;color:var(--color-primary)}

.contrib-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4);margin-bottom:var(--space-8)}
.contrib-stat{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-sm)}
.contrib-stat-value{display:block;font-family:var(--font-display);font-size:var(--text-xl);line-height:1;color:var(--color-primary);margin-bottom:var(--space-2)}
.contrib-stat-label{display:block;font-size:var(--text-xs);color:var(--color-text-muted);font-weight:600}
.contrib-layout{display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1.15fr);gap:var(--space-6);align-items:start}
.contrib-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-sm)}
.contrib-panel-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);margin-bottom:var(--space-4)}
.contrib-types{display:flex;flex-direction:column;gap:var(--space-4)}
.contrib-type{border-left:3px solid var(--color-primary-highlight);padding-left:var(--space-4)}
.contrib-type-name{font-size:var(--text-xs);font-weight:700;color:var(--color-primary);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--space-1)}
.contrib-type-desc{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.65}
.repo-list{display:flex;flex-direction:column;gap:var(--space-4)}
.repo-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-3);align-items:start}
.repo-name{font-size:var(--text-sm);font-weight:700;color:var(--color-text);line-height:1.25}
.repo-meta{font-size:var(--text-xs);color:var(--color-accent);font-weight:700;white-space:nowrap}
.repo-desc{grid-column:1/-1;font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.55;margin-top:-0.25rem}
.repo-bar{grid-column:1/-1;height:6px;border-radius:var(--radius-full);background:var(--color-surface-offset);overflow:hidden}
.repo-bar-fill{display:block;height:100%;width:var(--bar-width);border-radius:inherit;background:linear-gradient(90deg,var(--color-primary),color-mix(in srgb,var(--color-primary) 56%,var(--color-accent)))}
.contrib-note{font-size:var(--text-xs);color:var(--color-text-faint);margin-top:var(--space-5)}

.appt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-5)}
.appt-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5)}
.appt-icon{width:40px;height:40px;background:var(--color-primary-highlight);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4)}
.appt-role{font-size:var(--text-sm);font-weight:600;color:var(--color-text);margin-bottom:var(--space-1)}
.appt-org{font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-2)}
.appt-date{font-size:var(--text-xs);color:var(--color-text-faint)}

.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-5)}
.skill-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5)}
.skill-cat{font-size:var(--text-xs);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-3)}
.skill-items{display:flex;flex-direction:column;gap:var(--space-2)}
.skill-item{font-size:var(--text-sm);color:var(--color-text-muted);padding-left:var(--space-3);position:relative}
.skill-item::before{content:"-";position:absolute;left:0;color:var(--color-text-faint)}

.contact-section{background:var(--color-surface);border-top:1px solid var(--color-divider)}
.contact-inner{max-width:var(--content-narrow);margin:0 auto;padding:clamp(var(--space-12),6vw,var(--space-20)) var(--space-6);text-align:center}
.contact-title{font-size:var(--text-xl);margin-bottom:var(--space-4)}
.contact-desc{color:var(--color-text-muted);margin:0 auto var(--space-8)}
.contact-links{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--space-4)}
.contact-link{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--color-text-muted);padding:var(--space-3) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-md);transition:all var(--transition)}
.contact-link:hover{border-color:var(--color-primary);color:var(--color-primary)}
footer{padding:var(--space-8) var(--space-6);text-align:center;font-size:var(--text-xs);color:var(--color-text-faint);border-top:1px solid var(--color-divider)}

@keyframes grid-drift{from{background-position:0 0,0 0}to{background-position:84px 42px,42px 84px}}
@keyframes clinical-rotate{to{transform:rotate(360deg)}}

@media(max-width:840px){
  .nav-inner{align-items:flex-start;flex-wrap:wrap}
  .nav-links{order:3;width:100%;justify-content:flex-start;gap:var(--space-4);overflow-x:auto;padding-bottom:2px}
  .nav-actions{margin-left:auto}
}
@media(max-width:700px){
  .hero-grid{grid-template-columns:1fr;text-align:center}
  .hero-avatar{margin:0 auto;order:-1}
  .hero-tags{justify-content:center}
  .hero-contact{justify-content:center}
  .nav-inner{padding-inline:var(--space-4)}
  .nav-links{display:none}
  .lang-switcher{width:100%;justify-content:space-between}
  .lang-btn{flex:1}
  .award-item{grid-template-columns:1fr}
  .award-badge{width:fit-content}
  .project-card{min-height:auto}
  .contrib-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contrib-layout{grid-template-columns:1fr}
  .hero::after{display:none}
  .hero::before{inset:var(--space-6) var(--space-4);opacity:0.24}
  .ambient-canvas{opacity:0.55}
}
@media(max-width:460px){
  .contrib-summary{grid-template-columns:1fr}
  .repo-item{grid-template-columns:1fr}
  .repo-meta{white-space:normal}
}
@media(pointer:coarse),(prefers-reduced-motion:reduce){
  .tilt-card,.tilt-card:hover{transform:none;will-change:auto}
  .medal-card::after,.project-card::after{display:none}
  .ambient-canvas{display:none}
}
</style>
</head>
<body>
<canvas class="ambient-canvas" data-ambient-canvas aria-hidden="true"></canvas>
<nav>
  <div class="nav-inner">
    <span class="nav-brand" data-i18n="brand">Lixin Yin</span>
    <ul class="nav-links">
      <li><a href="#about" data-i18n="nav.about">About</a></li>
      <li><a href="#competitions" data-i18n="nav.competitions">Competitions</a></li>
      <li><a href="#awards" data-i18n="nav.awards">Awards</a></li>
      <li><a href="#projects" data-i18n="nav.projects">Projects</a></li>
      <li><a href="#appointments" data-i18n="nav.appointments">Appointments</a></li>
      <li><a href="#skills" data-i18n="nav.skills">Skills</a></li>
      <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="lang-switcher" role="group" aria-label="Language">
        <button class="lang-btn" type="button" data-lang="zh">中文</button>
        <button class="lang-btn" type="button" data-lang="ja">日本語</button>
        <button class="lang-btn" type="button" data-lang="en">English</button>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark mode"></button>

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,match=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[match]));
}

function getByPath(obj,path){
  return path.split('.').reduce((acc,key)=>acc&&acc[key],obj);
}

  if(matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(pointer: coarse)').matches) return;
  document.querySelectorAll('.tilt-card:not([data-tilt-ready])').forEach(card=>{
    card.dataset.tiltReady='true';
    card.addEventListener('pointermove',event=>{
      const rect=card.getBoundingClientRect();
      const x=(event.clientX-rect.left)/rect.width-0.5;
      const y=(event.clientY-rect.top)/rect.height-0.5;
      card.style.setProperty('--tilt-y',`${(x*7).toFixed(2)}deg`);
      card.style.setProperty('--tilt-x',`${(-y*7).toFixed(2)}deg`);
    });
    card.addEventListener('pointerleave',()=>{
      card.style.setProperty('--tilt-x','0deg');
      card.style.setProperty('--tilt-y','0deg');
    });
  });
}

function initAmbientCanvas(){
  const canvas=document.querySelector('[data-ambient-canvas]');
  if(!canvas||matchMedia('(prefers-reduced-motion: reduce)').matches||matchMedia('(pointer: coarse)').matches) return;

  const ctx=canvas.getContext('2d');
  const pointer={x:window.innerWidth*0.68,y:window.innerHeight*0.28,active:false};
  const nodes=[];
  const sparks=[];
  let width=0;
  let height=0;
  let dpr=1;

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    width=window.innerWidth;
    height=window.innerHeight;
    canvas.width=Math.floor(width*dpr);
    canvas.height=Math.floor(height*dpr);
    canvas.style.width=`${width}px`;
    canvas.style.height=`${height}px`;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    seedNodes();
  }

  function seedNodes(){
    nodes.length=0;
    const count=Math.max(34,Math.min(76,Math.floor(width*height/26000)));
    for(let i=0;i<count;i++){
      nodes.push({
        x:Math.random()*width,
        y:Math.random()*height,
        vx:(Math.random()-0.5)*0.18,
        vy:(Math.random()-0.5)*0.18,
        r:Math.random()*1.6+0.5
      });
    }
  }

  function color(alpha){
    const isDark=document.documentElement.getAttribute('data-theme')==='dark';
    return isDark?`rgba(79,152,163,${alpha})`:`rgba(1,105,111,${alpha})`;
  }

  function addSpark(event){
    pointer.x=event.clientX;
    pointer.y=event.clientY;
    pointer.active=true;
    const amount=event.pointerType==='mouse'?3:1;
    for(let i=0;i<amount;i++){
      sparks.push({
        x:pointer.x+(Math.random()-0.5)*7,
        y:pointer.y+(Math.random()-0.5)*7,
        vx:(Math.random()-0.5)*0.9,
        vy:(Math.random()-0.5)*0.9,
        life:1,
        size:Math.random()*2.6+1.2
      });
    }
    if(sparks.length>130) sparks.splice(0,sparks.length-130);
  }

  function draw(){
    ctx.clearRect(0,0,width,height);
    ctx.lineWidth=1;

    nodes.forEach(node=>{
      node.x+=node.vx;
      node.y+=node.vy;
      if(node.x<0||node.x>width) node.vx*=-1;
      if(node.y<0||node.y>height) node.vy*=-1;
    });

    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        const dx=a.x-b.x;
        const dy=a.y-b.y;
        const dist=Math.hypot(dx,dy);
        if(dist<118){
          ctx.strokeStyle=color((1-dist/118)*0.08);
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
      const pd=Math.hypot(a.x-pointer.x,a.y-pointer.y);
      if(pointer.active&&pd<180){
        ctx.strokeStyle=color((1-pd/180)*0.22);
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(pointer.x,pointer.y);
        ctx.stroke();
      }
      ctx.fillStyle=color(0.18);
      ctx.beginPath();
      ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
      ctx.fill();
    }

    for(let i=sparks.length-1;i>=0;i--){
      const spark=sparks[i];
      spark.x+=spark.vx;
      spark.y+=spark.vy;
      spark.life-=0.018;
      if(spark.life<=0){
        sparks.splice(i,1);
        continue;
      }
      ctx.fillStyle=color(spark.life*0.45);
      ctx.beginPath();
      ctx.arc(spark.x,spark.y,spark.size*spark.life,0,Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize',resize,{passive:true});
  window.addEventListener('pointermove',addSpark,{passive:true});
  window.addEventListener('pointerleave',()=>{pointer.active=false},{passive:true});
  draw();
}

(function(){
  const root=document.documentElement;
  const themeToggle=document.querySelector('[data-theme-toggle]');
  let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';

  function setTheme(next){
    theme=next;
    root.setAttribute('data-theme',theme);
    if(!themeToggle) return;
    themeToggle.innerHTML=theme==='dark'
      ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    themeToggle.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');
  }

  document.querySelectorAll('.lang-btn').forEach(btn=>{
    btn.addEventListener('click',()=>render(btn.dataset.lang));
  });
  themeToggle?.addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));

  const stored=localStorage.getItem('preferred-language');
  const browser=(navigator.language||'en').toLowerCase();
  const initial=stored||((browser.startsWith('zh'))?'zh':(browser.startsWith('ja')?'ja':'en'));
  setTheme(theme);
  render(initial);
  initAmbientCanvas();
})();
</script>
</body>
