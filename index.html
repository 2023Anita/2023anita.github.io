<link rel="stylesheet" href="fonts.css"><style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f0ede8;--color-divider:#dcd9d5;--color-border:rgba(40,37,29,0.12);
  --color-text:#28251d;--color-text-muted:#6b6a66;--color-text-faint:#b0afa9;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;--color-primary-highlight:#cedcd8;
  --color-accent:#964219;--glow-soft:rgba(1,105,111,0.13);--glow-strong:rgba(1,105,111,0.45);
  --font-display:'Instrument Serif',Georgia,'Noto Serif SC','Noto Serif JP',serif;
  --font-body:'DM Sans','Noto Sans SC','Noto Sans JP','Helvetica Neue',sans-serif;
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --text-2xl:clamp(2rem,1.2rem + 2.5vw,3.5rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;--space-20:5rem;
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(40,37,29,0.07);--shadow-md:0 4px 12px rgba(40,37,29,0.09);
  --shadow-lg:0 12px 32px rgba(40,37,29,0.13);
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --content-narrow:640px;--content-default:960px;
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#252320;--color-divider:#262523;--color-border:rgba(205,204,202,0.1);
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#7dbac2;--color-primary-highlight:#313b3b;
  --color-accent:#bb653b;--glow-soft:rgba(79,152,163,0.16);--glow-strong:rgba(79,152,163,0.62);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.2);--shadow-md:0 4px 12px rgba(0,0,0,0.3);--shadow-lg:0 12px 32px rgba(0,0,0,0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth;scroll-padding-top:5rem}
body{min-height:100dvh;line-height:1.6;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);isolation:isolate;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
h1,h2,h3,h4{text-wrap:balance;line-height:1.15;font-family:var(--font-display)}
p,li{text-wrap:pretty;max-width:72ch}
a{color:var(--color-primary);text-decoration:none;transition:color var(--transition)}
a:hover{color:var(--color-primary-hover)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;transition:color var(--transition),background var(--transition),border-color var(--transition)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}

.ambient-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.9}
body > :not(.ambient-canvas){position:relative;z-index:1}

nav{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--color-bg) 92%,transparent);border-bottom:1px solid var(--color-divider);backdrop-filter:blur(12px)}
.nav-inner{max-width:var(--content-default);margin:0 auto;padding:var(--space-3) var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.nav-brand{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;line-height:0}
.nav-brand picture{display:block}
.nav-brand-logo{display:block;width:7.5rem;height:auto;transition:transform var(--transition)}
.nav-brand:hover .nav-brand-logo{transform:scale(1.025)}
.nav-links{display:flex;gap:var(--space-5);list-style:none;align-items:center}
.nav-links a{font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;transition:color var(--transition)}
.nav-links a:hover{color:var(--color-primary)}
.nav-links a[aria-current="page"]{color:var(--color-primary)}
.nav-actions{display:flex;align-items:center;gap:var(--space-2)}
.lang-switcher{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-surface)}
.lang-btn{font-size:0.78rem;font-weight:600;line-height:1;padding:0.45rem 0.62rem;border-radius:var(--radius-full);color:var(--color-text-muted);white-space:nowrap}
.lang-btn:hover{color:var(--color-primary)}
.lang-btn[aria-pressed="true"]{background:var(--color-primary-highlight);color:var(--color-primary)}
.theme-toggle,.github-nav-link{display:flex;align-items:center;justify-content:center;padding:var(--space-2);border-radius:var(--radius-md);color:var(--color-text-muted)}
.theme-toggle:hover,.github-nav-link:hover{color:var(--color-text);background:var(--color-surface-offset)}
.github-nav-link:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}

.js-ready .workspace-page{display:none}
.js-ready .workspace-page.active{display:block}
.earth-page{background:#06090d}

.launch-stage{position:relative;min-height:calc(100dvh - 64px);max-width:var(--content-default);margin:0 auto;padding:clamp(var(--space-12),7vw,var(--space-20)) var(--space-6) var(--space-10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-8);overflow:hidden}
.launch-stage::before{content:"";position:absolute;inset:var(--space-8) var(--space-6);z-index:-1;background:
  linear-gradient(90deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/46px 46px,
  linear-gradient(0deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/46px 46px;mask-image:radial-gradient(circle at 50% 46%,black 0 48%,transparent 76%);opacity:0.45}
.launch-laptop{width:min(760px,100%);filter:drop-shadow(0 28px 34px rgba(40,37,29,0.16));animation:laptop-rise 780ms cubic-bezier(0.16,1,0.3,1) both}
.launch-screen-frame{border:14px solid #242421;border-bottom-width:18px;border-radius:1.1rem 1.1rem 0.5rem 0.5rem;background:#242421}
.launch-screen{min-height:360px;border-radius:0.35rem;background:
  linear-gradient(180deg,rgba(255,255,255,0.09),transparent 16%),
  repeating-linear-gradient(0deg,rgba(255,255,255,0.035) 0 1px,transparent 1px 4px),
  linear-gradient(135deg,#0b5860,#1c766c 58%,#234f58);color:#f3fbf8;overflow:hidden}
.launch-window-bar{height:36px;display:flex;align-items:center;gap:8px;padding:0 var(--space-4);border-bottom:1px solid rgba(255,255,255,0.12);font-size:0.72rem;color:rgba(255,255,255,0.55)}
.launch-window-bar span{width:10px;height:10px;border-radius:50%;background:#dd5f45}
.launch-window-bar span:nth-child(2){background:#d7ad37}
.launch-window-bar span:nth-child(3){background:#47a891}
.launch-window-bar strong{margin-left:auto;font-weight:600;letter-spacing:0.04em}
.launch-terminal{padding:var(--space-6);font-family:"SFMono-Regular","Cascadia Code","Menlo",monospace;font-size:clamp(0.84rem,1.5vw,1rem);line-height:1.85}
.launch-line{display:block;min-height:1.85em}
.launch-prompt{color:#f3cc73;font-weight:800}
.launch-output{color:rgba(255,255,255,0.86)}
.launch-cursor{display:inline-block;width:0.58em;height:1.15em;margin-left:0.15em;background:#f3cc73;vertical-align:-0.17em;animation:cursor-blink 1s steps(2,end) infinite}
.launch-base{height:26px;width:106%;margin-left:-3%;border-radius:0 0 48px 48px;background:linear-gradient(180deg,#bbb9b2,#e3e0d8 38%,#9b9992);position:relative}
.launch-base::after{content:"";position:absolute;left:50%;top:0;width:20%;height:6px;transform:translateX(-50%);border-radius:0 0 999px 999px;background:rgba(40,37,29,0.18)}
.launch-shadow{width:min(560px,70%);height:28px;margin:18px auto 0;border-radius:50%;background:radial-gradient(ellipse,rgba(40,37,29,0.18),transparent 70%);filter:blur(3px)}
.launch-next{display:flex;flex-direction:column;align-items:center;gap:var(--space-2);font-size:var(--text-xs);letter-spacing:0.14em;text-transform:uppercase;color:var(--color-text-faint);opacity:0;transform:translateY(8px);transition:opacity 600ms var(--transition),transform 600ms var(--transition)}
.intro-complete .launch-next{opacity:1;transform:translateY(0)}
.js-ready .home-body{opacity:0;max-height:0;overflow:hidden;transform:translateY(28px);transition:opacity 700ms var(--transition),transform 700ms var(--transition),max-height 900ms var(--transition)}
.js-ready .intro-complete .home-body{opacity:1;max-height:3200px;transform:none}

.hero{position:relative;max-width:var(--content-default);margin:0 auto;padding:clamp(var(--space-16),8vw,var(--space-20)) var(--space-6) var(--space-12);overflow:hidden}
.hero::before{content:"";position:absolute;inset:var(--space-8) var(--space-6) var(--space-8);z-index:-1;border-radius:1.5rem;background:
  linear-gradient(90deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/42px 42px,
  linear-gradient(0deg,transparent 0 96%,var(--glow-soft) 96% 100%) 0 0/42px 42px;
  mask-image:linear-gradient(90deg,transparent,black 18%,black 82%,transparent);
  opacity:0.34;animation:grid-drift 18s linear infinite}
.hero::after{content:"";position:absolute;right:7%;top:22%;width:260px;height:260px;z-index:-1;border:1px solid var(--color-border);border-radius:50%;background:
  repeating-conic-gradient(from 0deg,var(--glow-soft) 0deg 8deg,transparent 8deg 20deg);
  mask-image:radial-gradient(circle,transparent 0 48%,black 49% 51%,transparent 52% 100%);
  opacity:0.45;animation:clinical-rotate 28s linear infinite}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-12);align-items:center}
.hero-kicker{font-size:var(--text-xs);font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--color-accent);margin-bottom:var(--space-3)}
.hero-name{font-size:var(--text-2xl);font-style:italic;color:var(--color-text);margin-bottom:var(--space-2)}
.hero-role{font-size:var(--text-lg);color:var(--color-primary);font-family:var(--font-body);font-weight:500;margin-bottom:var(--space-4)}
.hero-institution{font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-6)}
.hero-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-6)}
.tag{font-size:var(--text-xs);padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-primary-highlight);color:var(--color-primary);font-weight:500}
.hero-bio{font-size:var(--text-base);color:var(--color-text-muted);line-height:1.7;max-width:60ch}
.hero-contact{margin-top:var(--space-6);display:flex;flex-wrap:wrap;gap:var(--space-3)}
.btn-primary{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-6);background:var(--color-primary);color:#fff;border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;transition:background var(--transition)}
.btn-primary:hover{background:var(--color-primary-hover);color:#fff}
.btn-ghost{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-muted);font-weight:500;transition:all var(--transition)}
.btn-ghost:hover{border-color:var(--color-primary);color:var(--color-primary)}
.hero-avatar{position:relative;width:180px;height:180px;border-radius:var(--radius-lg);background:var(--color-surface-offset);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);overflow:hidden;flex-shrink:0}
.hero-avatar::after{content:"";position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--color-primary) 32%,transparent);border-radius:inherit;box-shadow:inset 0 0 28px rgba(1,105,111,0.14);pointer-events:none}
.workstation-panel{display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1.05fr);gap:var(--space-5);margin-top:var(--space-10)}
.terminal-card,.signal-card,.communication-card{background:color-mix(in srgb,var(--color-surface) 88%,transparent);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);backdrop-filter:blur(10px)}
.terminal-card{overflow:hidden}
.terminal-bar{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border);font-size:0.72rem;color:var(--color-text-faint)}
.terminal-bar span{width:9px;height:9px;border-radius:var(--radius-full);background:var(--color-accent);display:inline-block}
.terminal-bar span:nth-child(2){background:#d8a331}
.terminal-bar span:nth-child(3){background:var(--color-primary)}
.terminal-bar strong{margin-left:auto;font-weight:600;color:var(--color-text-muted)}
.terminal-lines{padding:var(--space-5);font-family:"SFMono-Regular","Cascadia Code","Menlo",monospace;font-size:0.84rem;color:var(--color-text);min-height:178px}
.terminal-line{display:block;margin-bottom:var(--space-3)}
.terminal-prompt{color:var(--color-primary);font-weight:700}
.terminal-output{color:var(--color-text-muted)}
.terminal-cursor{display:inline-block;width:0.55em;height:1.1em;margin-left:0.15em;background:var(--color-primary);vertical-align:-0.16em;animation:cursor-blink 1s steps(2,end) infinite}
.signal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
.signal-card{position:relative;padding:var(--space-5);overflow:hidden}
.signal-card::before{content:"";position:absolute;inset:auto var(--space-5) 0 var(--space-5);height:3px;background:linear-gradient(90deg,var(--color-primary),var(--color-accent));opacity:0.72}
.signal-value{font-family:var(--font-display);font-size:var(--text-xl);line-height:1;color:var(--color-primary);margin-bottom:var(--space-2)}
.signal-label{font-size:var(--text-xs);font-weight:700;color:var(--color-text);letter-spacing:0.04em;text-transform:uppercase}
.signal-desc{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-2)}

.portfolio-hero{padding-bottom:var(--space-8)}
.portfolio-rail{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:var(--space-6)}
.portfolio-rail a{display:inline-flex;align-items:center;min-height:38px;padding:var(--space-2) var(--space-4);border:1px solid var(--color-border);border-radius:var(--radius-full);background:var(--color-surface);font-size:var(--text-xs);font-weight:700;color:var(--color-text-muted)}
.portfolio-rail a:hover{border-color:var(--color-primary);color:var(--color-primary);transform:translateY(-1px)}

.section{border-top:1px solid var(--color-divider);padding:clamp(var(--space-12),6vw,var(--space-20)) var(--space-6)}
.section-inner{max-width:var(--content-default);margin:0 auto}
.section-header{margin-bottom:var(--space-10)}
.section-label{font-size:var(--text-xs);font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-2)}
.section-title{font-size:var(--text-xl);color:var(--color-text)}

.medals-grid,.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-5)}
.medal-card,.project-card{position:relative;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-6);box-shadow:var(--shadow-sm);transition:box-shadow var(--transition),transform var(--transition),border-color var(--transition);overflow:hidden}
.medal-card::after,.project-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 42%,var(--glow-soft) 50%,transparent 58% 100%);opacity:0;transform:translateX(-30%);transition:opacity var(--transition),transform 520ms cubic-bezier(0.16,1,0.3,1);pointer-events:none}
.medal-card:hover,.project-card:hover{border-color:color-mix(in srgb,var(--color-primary) 34%,var(--color-border));box-shadow:var(--shadow-md);transform:translateY(-2px)}
.medal-card:hover::after,.project-card:hover::after{opacity:1;transform:translateX(30%)}
.tilt-card{--tilt-x:0deg;--tilt-y:0deg;--tilt-lift:0px;transform:perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateY(var(--tilt-lift));transform-style:preserve-3d;will-change:transform}
.tilt-card:hover{--tilt-lift:-3px}
.medal-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.medal-icon{width:36px;height:36px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.medal-silver{background:#e8e8e8;color:#6b6b6b}
.medal-bronze{background:#f5e6d3;color:#8b5e3c}
.medal-title,.project-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);line-height:1.3}
.medal-rank{font-size:var(--text-xs);color:var(--color-primary);font-weight:600;margin-bottom:var(--space-2)}
.medal-org,.medal-desc,.project-desc{font-size:var(--text-xs);color:var(--color-text-muted)}
.medal-org{margin-bottom:var(--space-2)}
.medal-desc,.project-desc{line-height:1.6}
.medal-date{font-size:var(--text-xs);color:var(--color-text-faint);margin-top:var(--space-3)}

.awards-list{display:flex;flex-direction:column;gap:var(--space-5)}
.award-item{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:start}
.award-badge,.project-stars{font-size:var(--text-xs);font-weight:600;padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-surface-offset);color:var(--color-accent);white-space:nowrap}
.award-badge{margin-top:3px}
.award-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);margin-bottom:var(--space-1)}
.award-project{font-size:var(--text-sm);color:var(--color-primary);font-style:italic;margin-bottom:var(--space-2)}
.award-meta{font-size:var(--text-xs);color:var(--color-text-muted)}

.communication-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,0.85fr);gap:var(--space-5)}
.communication-card{position:relative;padding:var(--space-6);overflow:hidden}
.communication-card.featured{min-height:320px}
.communication-card::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border:1px solid color-mix(in srgb,var(--color-primary) 34%,transparent);border-radius:50%;opacity:0.45}
.communication-feature-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 174px;gap:var(--space-6);align-items:center;min-height:270px}
.communication-copy{min-width:0}
.communication-qr{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-self:end;gap:var(--space-2);width:174px;padding:var(--space-2) var(--space-2) var(--space-3);border:1px solid color-mix(in srgb,var(--color-accent) 30%,var(--color-border));border-radius:var(--radius-md);background:color-mix(in srgb,var(--color-surface) 82%,transparent);box-shadow:var(--shadow-sm);transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition)}
.communication-qr::before{content:"";position:absolute;left:var(--space-3);right:var(--space-3);top:0;height:3px;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--color-accent),var(--color-primary));opacity:0.7}
.communication-qr img{display:block;width:154px;height:auto;aspect-ratio:7/8;border-radius:calc(var(--radius-md) - 2px);object-fit:contain;background:#fff;box-shadow:0 5px 14px rgba(40,37,29,0.08)}
.communication-qr-label{font-size:0.68rem;font-weight:700;line-height:1.25;color:var(--color-primary);text-align:center}
.communication-qr:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--color-primary) 40%,var(--color-border));box-shadow:var(--shadow-md)}
.communication-name{font-size:var(--text-lg);color:var(--color-text);margin-bottom:var(--space-2)}
.communication-role{font-size:var(--text-sm);font-weight:700;color:var(--color-primary);margin-bottom:var(--space-3)}
.communication-desc{font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.7}
